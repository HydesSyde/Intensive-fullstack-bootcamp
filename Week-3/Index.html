    />

    <!-- Internal styling with css. Play with it, but dont break it -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #f7f5e1;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      a {
        text-decoration: none;
        color: crimson;
      }

      img {
        width: 300px;
        height: 300px;
        border-radius: 10px;
        object-fit: cover;
      }

      h1,
      h2,
      h3 {
        font-family: "DM-Sans", Arial, sans-serif;
        color: blue;
      }

      p {
        font-family: "DM Mono", monospace;
        font-size: 12px;
        color: #cad2eb;
      }
      .nav {
        border-bottom: 1px solid blue;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
      }

      .main {
        width: 100%;
        height: 95vh;
        display: flex;
        flex-direction: row;
      }

      .left-section {
        width: 40%;
        height: 100%;
        padding: 20px;
        margin-right: 10px;
        border-right: 1px solid blue;
        text-align: center;
        background-image:
          linear-gradient(to right, #e5e7eb 1px, transparent 1px),
          linear-gradient(to bottom, #e5e7eb 1px, transparent 1px);
        background-size: 30px 30px;
      }

      .right-section {
        width: 60%;
        height: 100%;
        padding: 10px;
        border-bottom: 1px solid blue;
      }
    </style>
  </head>
  <body>
    <div class="nav">
